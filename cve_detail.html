<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOKERXX | Vulnerability Detail</title>
    <meta
      name="description"
      content="Vulnerability detail page showing public Apache CVE and CNVD records with source links."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="detail-page" data-page="detail">
    <div class="page-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="grid-mask"></div>

      <header class="topbar">
        <a class="brand" href="index.html">
          <span class="brand-name">LOKERXX</span>
          <span class="brand-tagline" data-i18n="brandTagline">Security research journal</span>
        </a>
        <div class="topbar-tools">
          <nav class="nav">
            <a href="index.html" data-i18n="navHome">Home</a>
            <a href="#detail-index" data-i18n="navTable">Table</a>
            <a href="#category-cnvd" data-i18n="navCnvd">CNVD</a>
            <a href="#detail-list" data-i18n="navDetails">Details</a>
          </nav>
          <button class="lang-toggle" id="language-toggle" type="button">中文</button>
        </div>
      </header>

      <main>
        <nav class="category-nav" aria-label="Record categories">
          <span class="category-nav-label" data-i18n="categoryNavLabel">Browse by category</span>
          <a href="#category-cve" data-i18n="categoryCve">Apache CVE</a>
          <a href="#category-cnvd" data-i18n="categoryCnvd">CNVD</a>
        </nav>

        <section id="detail-index" class="section records-section">
          <div id="detail-index-groups"></div>

          <div class="detail-list" id="detail-list"></div>
        </section>
      </main>

      <footer class="footer">
        <p>© <span id="year"></span> LOKERXX.</p>
      </footer>
    </div>

    <script src="cve-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>

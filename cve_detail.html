<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOKERXX | Apache CVE Detail</title>
    <meta
      name="description"
      content="Apache CVE detail page showing both published records and reserved identifiers being tracked."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="detail-page" data-page="detail">
    <div class="page-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="grid-mask"></div>

      <header class="topbar">
        <a class="brand" href="index.html">LOKERXX / RESEARCH</a>
        <div class="topbar-tools">
          <nav class="nav">
            <a href="index.html" data-i18n="navHome">Home</a>
            <a href="#detail-index" data-i18n="navTable">Table</a>
            <a href="#detail-list" data-i18n="navDetails">Details</a>
          </nav>
          <button class="lang-toggle" id="language-toggle" type="button">中文</button>
        </div>
      </header>

      <main>
        <section id="detail-index" class="section">
          <article class="panel table-panel">
            <div class="table-wrap">
              <table class="research-table detail-index-table">
                <thead>
                  <tr>
                    <th data-i18n="colVendor">Vendor</th>
                    <th data-i18n="colCve">CVE ID</th>
                    <th data-i18n="colOfficialSeverity">Official Severity</th>
                    <th data-i18n="colOfficialScore">Official Score</th>
                    <th data-i18n="colNvdScore">NVD Score</th>
                    <th data-i18n="colStatus">Status</th>
                  </tr>
                </thead>
                <tbody id="detail-index-body"></tbody>
              </table>
            </div>
          </article>

          <div class="detail-list" id="detail-list"></div>
        </section>
      </main>

      <footer class="footer">
        <p>© <span id="year"></span> LOKERXX.</p>
      </footer>
    </div>

    <script src="cve-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
